services:
  gogs-vulnerable:
    image: cyber-arena-stage3/gogs:vulnerable-e3bb4165
    build:
      context: .
      dockerfile: Dockerfile.gogs
      args:
        GOGS_COMMIT: e3bb4165dceb96b66053a067f9f3584302413a0e
    environment:
      STAGE3_WITNESS: ${VULNERABLE_WITNESS}
    volumes:
      - ${STAGE3_RUN_DIR}/vulnerable:/data
    networks:
      study:
        aliases: [gogs-vulnerable]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 60

  gogs-fixed:
    image: cyber-arena-stage3/gogs:fixed-a9dbafbf-on-e3bb4165
    build:
      context: .
      dockerfile: Dockerfile.gogs
      args:
        GOGS_COMMIT: e3bb4165dceb96b66053a067f9f3584302413a0e
        GOGS_PATCH_COMMIT: a9dbafbfd8e1020bacc626420238c01d75d03364
    environment:
      STAGE3_WITNESS: ${FIXED_WITNESS}
    volumes:
      - ${STAGE3_RUN_DIR}/fixed:/data
    networks:
      study:
        aliases: [gogs-fixed]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 60

  attacker:
    container_name: stage3-gogs-attacker
    build:
      context: .
      dockerfile: Dockerfile.attacker
    volumes:
      - ./evidence:/study/evidence
    networks:
      study:
        aliases: [stage3-gogs-attacker]

networks:
  study: {}
